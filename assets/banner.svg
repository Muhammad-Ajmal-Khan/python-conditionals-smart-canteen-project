<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Smart Canteen Discount System Banner">
  <defs>
    <linearGradient id="cBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="260">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cBar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="260" rx="14" fill="#0F172A"/>
  <rect x="0" y="0" width="1000" height="260" rx="14" fill="url(#cBg)"/>

  <circle cx="940" cy="28" r="95" fill="#A78BFA" opacity="0.14"/>
  <circle cx="520" cy="246" r="78" fill="#F59E0B" opacity="0.12"/>
  <rect x="0" y="0" width="1000" height="5" rx="2" fill="#F59E0B"/>
  <rect x="0" y="0" width="1000" height="5" rx="2" fill="url(#cBar)"/>

  <!-- Top Badge -->
  <rect x="40" y="24" width="218" height="24" rx="12" fill="#3B0764" stroke="#C084FC" stroke-width="1"/>
  <text x="149" y="40" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" letter-spacing="0.8">PYTHON CONDITIONALS LAB</text>

  <!-- Title & Subtitle -->
  <text x="40" y="84" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#FFFFFF">Smart Canteen</text>
  <text x="40" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FCD34D">Discount System</text>
  <text x="40" y="135" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#CBD5E1">Decision-making with if / elif / else, input validation &amp; tiered billing.</text>

  <!-- Concept Chips -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600">
    <rect x="40" y="152" width="112" height="28" rx="14" fill="#4C1D95" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="96" y="170" text-anchor="middle" fill="#EDE9FE">if / elif / else</text>

    <rect x="162" y="152" width="124" height="28" rx="14" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.2"/>
    <text x="224" y="170" text-anchor="middle" fill="#FEE2E2">Input Validation</text>

    <rect x="296" y="152" width="130" height="28" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="361" y="170" text-anchor="middle" fill="#DBEAFE">Tiered Discounts</text>

    <rect x="436" y="152" width="126" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="499" y="170" text-anchor="middle" fill="#D1FAE5">CLI Formatting</text>
  </g>

  <!-- Author Footer -->
  <line x1="40" y1="198" x2="564" y2="198" stroke="#334155" stroke-width="1"/>
  <text x="40" y="224" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">MUHAMMAD AJMAL KHAN</text>
  <text x="232" y="224" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#94A3B8">github.com/Muhammad-Ajmal-Khan</text>

  <!-- Right Code Window -->
  <rect x="594" y="24" width="376" height="212" rx="10" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <rect x="594" y="24" width="376" height="30" rx="10" fill="#1E293B"/>
  <rect x="594" y="42" width="376" height="12" fill="#1E293B"/>
  <circle cx="614" cy="39" r="5" fill="#EF4444"/>
  <circle cx="630" cy="39" r="5" fill="#F59E0B"/>
  <circle cx="646" cy="39" r="5" fill="#10B981"/>
  <text x="790" y="43" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="10.5" fill="#94A3B8">smart_canteen_discount.py</text>

  <g font-family="Consolas, Menlo, Courier New, monospace" font-size="11.2">
    <text x="612" y="75" fill="#64748B"># Standard discount tier cascade</text>
    <text x="612" y="95">
      <tspan fill="#C084FC">if </tspan><tspan fill="#E2E8F0">bill </tspan><tspan fill="#38BDF8">&gt;= </tspan><tspan fill="#FBBF24">3000</tspan><tspan fill="#E2E8F0">:   rate </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#34D399">0.20</tspan>
    </text>
    <text x="612" y="115">
      <tspan fill="#C084FC">elif </tspan><tspan fill="#E2E8F0">bill </tspan><tspan fill="#38BDF8">&gt;= </tspan><tspan fill="#FBBF24">2000</tspan><tspan fill="#E2E8F0">: rate </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#34D399">0.10</tspan>
    </text>
    <text x="612" y="135">
      <tspan fill="#C084FC">elif </tspan><tspan fill="#E2E8F0">bill </tspan><tspan fill="#38BDF8">&gt;= </tspan><tspan fill="#FBBF24">1000</tspan><tspan fill="#E2E8F0">: rate </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#34D399">0.05</tspan>
    </text>
    <text x="612" y="155">
      <tspan fill="#C084FC">else</tspan><tspan fill="#E2E8F0">:             rate </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#34D399">0.00</tspan>
    </text>
    <text x="612" y="180" fill="#64748B"># +5% member discount on remaining</text>
    <text x="612" y="200">
      <tspan fill="#E2E8F0">member_disc </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#E2E8F0">remaining * </tspan><tspan fill="#34D399">0.05</tspan>
    </text>
    <text x="612" y="220">
      <tspan fill="#E2E8F0">payable </tspan><tspan fill="#38BDF8">= </tspan><tspan fill="#E2E8F0">bill - (std + member_disc)</tspan>
    </text>
  </g>
</svg>
