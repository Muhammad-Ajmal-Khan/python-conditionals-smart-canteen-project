<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-label="UML Module Diagram">
  <defs>
    <marker id="cu-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="cu-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="cu-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="700" fill="#FFFFFF"/>
  <rect x="8" y="8" width="1044" height="684" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="530" y="38" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0F172A">UML Module Diagram — Smart Canteen Discount System</text>
  <text x="530" y="59" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Procedural module constants, entry point, «calls» dependencies, and bill summary data contract</text>
  <line x1="30" y1="74" x2="1030" y2="74" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Package Tab -->
  <path d="M 36 90 L 316 90 L 332 114 L 36 114 Z" fill="#7C3AED"/>
  <text x="178" y="106" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">«module» smart_canteen_discount.py</text>
  <rect x="36" y="114" width="988" height="422" rx="6" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>

  <!-- Constants Compartment -->
  <rect x="56" y="128" width="948" height="78" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="72" y="146" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#4C1D95">MODULE CONSTANTS &amp; STANDARD LIBRARY</text>
  <text x="72" y="164" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" fill="#1E293B">TIER_HIGH_THRESHOLD = 3000.0 (20%)  |  TIER_MID_THRESHOLD = 2000.0 (10%)  |  TIER_LOW_THRESHOLD = 1000.0 (5%)</text>
  <text x="72" y="181" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" fill="#1E293B">TIER_NONE_RATE = 0.00  |  MEMBERSHIP_DISCOUNT_RATE = 0.05  |  MIN_BILL_AMOUNT = 0.0</text>
  <text x="72" y="198" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" fill="#1E293B">VALID_YES_INPUT = "yes"  |  VALID_NO_INPUT = "no"  |  import math (math.isfinite)</text>

  <!-- Central Entry Point: main() -->
  <rect x="430" y="222" width="200" height="38" rx="6" fill="#0F172A"/>
  <text x="530" y="246" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="700" fill="#FFFFFF">main()</text>

  <!-- Clean Central Bus at x=530 -->
  <line x1="530" y1="260" x2="530" y2="478" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4,2"/>
  <rect x="502" y="268" width="56" height="16" rx="4" fill="#F8FAFC"/>
  <text x="530" y="280" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#1E3A8A">«calls»</text>

  <!-- LEFT COLUMN: Console Input & Header Functions -->
  <text x="56" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#1E3A8A">CLI HEADER &amp; VALIDATED INPUT</text>

  <rect x="56" y="304" width="414" height="46" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="72" y="325" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#0F172A">display_banner()</text>
  <text x="72" y="341" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">Prints the SMART CANTEEN title banner and separators</text>
  <line x1="530" y1="327" x2="470" y2="327" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-blue)"/>

  <rect x="56" y="370" width="414" height="48" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="72" y="391" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">get_valid_bill_amount() -&gt; float</text>
  <text x="72" y="408" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1E40AF">Catches ValueError; rejects blank, &lt;= 0, NaN/inf inputs</text>
  <line x1="530" y1="394" x2="470" y2="394" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-blue)"/>

  <rect x="56" y="438" width="414" height="48" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="72" y="459" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">get_membership_status() -&gt; bool</text>
  <text x="72" y="476" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1E40AF">Accepts only 'yes' or 'no' (case-insensitive); rejects others</text>
  <line x1="530" y1="462" x2="470" y2="462" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-blue)"/>

  <!-- RIGHT COLUMN: Discount Logic & Summary Output -->
  <text x="590" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#4C1D95">CONDITIONAL PRICING &amp; OUTPUT</text>

  <rect x="590" y="304" width="414" height="52" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="606" y="326" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.2" font-weight="700" fill="#4C1D95">calculate_bill_details(bill, is_member)</text>
  <text x="606" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">Computes standard discount, sequential 5% member discount &amp; totals</text>
  <line x1="530" y1="330" x2="590" y2="330" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-blue)"/>

  <!-- Nested call arrow from calculate_bill_details -> get_standard_discount_rate -->
  <line x1="797" y1="356" x2="797" y2="386" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-purple)"/>
  <text x="832" y="375" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#4C1D95">«calls»</text>

  <rect x="614" y="386" width="366" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="797" y="405" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#4C1D95">get_standard_discount_rate(bill_amount)</text>
  <text x="797" y="421" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#4C1D95">if / elif / else tier selector (20%, 10%, 5%, 0%)</text>

  <rect x="590" y="452" width="414" height="52" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="606" y="474" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.2" font-weight="700" fill="#065F46">display_bill_summary(details)</text>
  <text x="606" y="492" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#047857">Prints formatted Rs. summary + congratulatory or 0% notice</text>
  <line x1="530" y1="478" x2="590" y2="478" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#cu-blue)"/>

  <!-- Bottom Data Contract Box -->
  <rect x="190" y="592" width="680" height="74" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="530" y="614" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">«data contract»</text>
  <text x="530" y="633" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="700" fill="#0F172A">bill_details: dict[str, float | int]</text>
  <text x="530" y="652" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="10.8" fill="#047857">{original_bill, standard_rate_pct, standard_discount, membership_discount, total_savings, final_payable}</text>

  <line x1="530" y1="536" x2="530" y2="592" stroke="#059669" stroke-width="1.8" marker-end="url(#cu-green)" marker-start="url(#cu-green)"/>
  <text x="602" y="568" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">«produces / prints»</text>
</svg>
