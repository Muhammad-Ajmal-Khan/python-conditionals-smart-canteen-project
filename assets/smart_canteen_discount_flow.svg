<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1060" width="1080" height="1060" role="img" aria-label="Smart Canteen Discount Program Flow">
  <defs>
    <marker id="c-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="c-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="c-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="c-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="1060" fill="#FFFFFF"/>
  <rect x="8" y="8" width="1064" height="1044" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="540" y="38" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Program Flow: Smart Canteen Discount System (smart_canteen_discount.py)</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="600">
    <rect x="190" y="52" width="90" height="22" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="235" y="67" text-anchor="middle" fill="#1E3A8A">Input</text>
    <rect x="295" y="52" width="100" height="22" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="345" y="67" text-anchor="middle" fill="#4C1D95">Decision</text>
    <rect x="410" y="52" width="110" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
    <text x="465" y="67" text-anchor="middle" fill="#065F46">Success / Output</text>
    <rect x="535" y="52" width="110" height="22" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="590" y="67" text-anchor="middle" fill="#991B1B">Error / Reject</text>
    <rect x="660" y="52" width="110" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="715" y="67" text-anchor="middle" fill="#92400E">Notice / 0%</text>
    <rect x="785" y="52" width="105" height="22" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="837" y="67" text-anchor="middle" fill="#0F172A">Process</text>
  </g>
  <line x1="30" y1="84" x2="1050" y2="84" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- START -->
  <rect x="465" y="96" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="540" y="119" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">START</text>
  <line x1="540" y1="132" x2="540" y2="154" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Input Bill Amount -->
  <rect x="380" y="154" width="320" height="46" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="174" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">display_banner() &amp; Input Bill Amount</text>
  <text x="540" y="191" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1E40AF">Enter your total bill amount (Rs.)</text>
  <line x1="540" y1="200" x2="540" y2="222" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Validate Bill Decision -->
  <polygon points="540,222 670,258 540,294 410,258" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="254" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">Valid finite float</text>
  <text x="540" y="270" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">&amp; bill &gt; 0?</text>

  <!-- Bill Invalid -> Red Error -> Loop back -->
  <line x1="670" y1="258" x2="762" y2="258" stroke="#DC2626" stroke-width="1.8" marker-end="url(#c-red)"/>
  <text x="714" y="250" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#991B1B">No</text>
  <rect x="762" y="232" width="262" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="893" y="254" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Catch ValueError / Reject &lt;= 0</text>
  <text x="893" y="271" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7F1D1D">Print validation error &amp; re-prompt</text>
  <path d="M 893 232 L 893 177 L 700 177" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#c-red)"/>

  <!-- Bill Valid -> Input Membership -->
  <line x1="540" y1="294" x2="540" y2="320" stroke="#059669" stroke-width="1.8" marker-end="url(#c-green)"/>
  <text x="558" y="311" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>

  <rect x="380" y="320" width="320" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="347" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Input Membership Card Status (yes / no)</text>
  <line x1="540" y1="364" x2="540" y2="386" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Validate Membership Decision -->
  <polygon points="540,386 670,420 540,454 410,420" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="417" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">Answer in</text>
  <text x="540" y="432" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">{'yes', 'no'}?</text>

  <!-- Membership Invalid -> Red Error -> Loop back -->
  <line x1="670" y1="420" x2="762" y2="420" stroke="#DC2626" stroke-width="1.8" marker-end="url(#c-red)"/>
  <text x="714" y="412" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#991B1B">No</text>
  <rect x="762" y="396" width="262" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="893" y="417" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Invalid Membership Input</text>
  <text x="893" y="433" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7F1D1D">Prompt: enter 'yes' or 'no'</text>
  <path d="M 893 396 L 893 342 L 700 342" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#c-red)"/>

  <!-- Membership Valid -> if / elif / else Tier Cascade Container -->
  <line x1="540" y1="454" x2="540" y2="484" stroke="#059669" stroke-width="1.8" marker-end="url(#c-green)"/>
  <text x="558" y="472" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>

  <!-- Horizontal Dispatch Bar for 4 Conditional Tiers -->
  <rect x="44" y="484" width="992" height="162" rx="10" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="505" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#4C1D95">Standard Discount Conditional Cascade — get_standard_discount_rate(bill)</text>

  <line x1="165" y1="520" x2="915" y2="520" stroke="#7C3AED" stroke-width="1.8"/>
  <line x1="165" y1="520" x2="165" y2="544" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#c-slate)"/>
  <line x1="415" y1="520" x2="415" y2="544" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#c-slate)"/>
  <line x1="665" y1="520" x2="665" y2="544" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#c-slate)"/>
  <line x1="915" y1="520" x2="915" y2="544" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Tier 1: if >= 3000 -->
  <rect x="64" y="544" width="202" height="84" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="165" y="566" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#4C1D95">if bill &gt;= 3000</text>
  <line x1="84" y1="576" x2="246" y2="576" stroke="#C4B5FD" stroke-width="1"/>
  <text x="165" y="596" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#065F46">20% Discount</text>
  <text x="165" y="614" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#334155">rate = 0.20</text>

  <!-- Tier 2: elif >= 2000 -->
  <rect x="314" y="544" width="202" height="84" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="415" y="566" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#4C1D95">elif bill &gt;= 2000</text>
  <line x1="334" y1="576" x2="496" y2="576" stroke="#C4B5FD" stroke-width="1"/>
  <text x="415" y="596" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#065F46">10% Discount</text>
  <text x="415" y="614" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#334155">rate = 0.10</text>

  <!-- Tier 3: elif >= 1000 -->
  <rect x="564" y="544" width="202" height="84" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="665" y="566" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#4C1D95">elif bill &gt;= 1000</text>
  <line x1="584" y1="576" x2="746" y2="576" stroke="#C4B5FD" stroke-width="1"/>
  <text x="665" y="596" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#065F46">5% Discount</text>
  <text x="665" y="614" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#334155">rate = 0.05</text>

  <!-- Tier 4: else (< 1000) -->
  <rect x="814" y="544" width="202" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="915" y="566" text-anchor="middle" font-family="Consolas, Menlo, Courier New, monospace" font-size="11.5" font-weight="700" fill="#92400E">else (bill &lt; 1000)</text>
  <line x1="834" y1="576" x2="996" y2="576" stroke="#FCD34D" stroke-width="1"/>
  <text x="915" y="596" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#92400E">0% Discount</text>
  <text x="915" y="614" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#78350F">rate = 0.00</text>

  <!-- Merge out of Tier Cascade into Membership Decision -->
  <line x1="540" y1="646" x2="540" y2="674" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Membership Decision Diamond -->
  <polygon points="540,674 662,712 540,750 418,712" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="709" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">is_member</text>
  <text x="540" y="724" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">== True?</text>

  <!-- Left: Yes -> +5% on remaining -->
  <line x1="418" y1="712" x2="342" y2="712" stroke="#059669" stroke-width="1.8" marker-end="url(#c-green)"/>
  <text x="382" y="704" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>
  <rect x="64" y="684" width="278" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="203" y="707" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#065F46">Apply 5% Membership Discount</text>
  <text x="203" y="725" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#047857">member_disc = (bill - std_disc) * 0.05</text>

  <!-- Right: No -> Rs. 0.00 -->
  <line x1="662" y1="712" x2="738" y2="712" stroke="#D97706" stroke-width="1.8" marker-end="url(#c-amber)"/>
  <text x="700" y="704" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#92400E">No</text>
  <rect x="738" y="684" width="278" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="877" y="707" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#92400E">No Membership Discount</text>
  <text x="877" y="725" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#78350F">member_disc = 0.00</text>

  <!-- Merge into Compute Totals & Display Bill Summary -->
  <path d="M 203 740 L 203 772 L 540 772 L 540 792" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>
  <path d="M 877 740 L 877 772 L 540 772" fill="none" stroke="#475569" stroke-width="1.8"/>

  <rect x="315" y="792" width="450" height="54" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
  <text x="540" y="815" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Compute Total Savings &amp; Print BILL SUMMARY</text>
  <text x="540" y="833" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#334155">total_savings = std_disc + member_disc  |  payable = bill - total_savings</text>
  <line x1="540" y1="846" x2="540" y2="870" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>

  <!-- Savings > 0 Decision -->
  <polygon points="540,870 648,906 540,942 432,906" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="903" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">total_savings</text>
  <text x="540" y="918" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">&gt; 0?</text>

  <!-- Yes -> Congratulations -->
  <line x1="432" y1="906" x2="352" y2="906" stroke="#059669" stroke-width="1.8" marker-end="url(#c-green)"/>
  <text x="394" y="898" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>
  <rect x="74" y="882" width="278" height="48" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="213" y="903" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Print Congratulatory Message</text>
  <text x="213" y="919" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#047857">"Congratulations! You saved Rs. X.XX."</text>

  <!-- No -> No discount applied -->
  <line x1="648" y1="906" x2="728" y2="906" stroke="#D97706" stroke-width="1.8" marker-end="url(#c-amber)"/>
  <text x="686" y="898" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#92400E">No</text>
  <rect x="728" y="882" width="278" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="867" y="903" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#92400E">Print Standard Notice</text>
  <text x="867" y="919" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#78350F">"No discount applied on this bill."</text>

  <!-- Merge into END -->
  <path d="M 213 930 L 213 968 L 540 968 L 540 990" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#c-slate)"/>
  <path d="M 867 930 L 867 968 L 540 968" fill="none" stroke="#475569" stroke-width="1.8"/>

  <rect x="465" y="990" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="540" y="1013" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">END</text>
</svg>
